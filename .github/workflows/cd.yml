name: CD

on:
    push:
        branches: [main]

jobs:
    tests:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.23.0'

            - name: Build App
              run: ./scripts/buildprod.sh

    job_id:
        name: Authenticate and Deploy
        runs-on: ubuntu-latest

        steps:
            - id: 'auth'
              name: 'Authenticate'
              uses: 'google-github-actions/auth@v2'
              with:
                  credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

            - name: 'Set up Cloud SDK'
              uses: google-github-actions/setup-gcloud@v1

            - name: 'Build and push to Docker'
              run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-notely-556893911971/notely-r-repo1/notely:latest .'

            - name: Deploy to Cloud Run
              run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-notely-556893911971/notely-r-repo1/notely:latest --region us-central1 --allow-unauthenticated --project notely-notely-556893911971 --max-instances=4
