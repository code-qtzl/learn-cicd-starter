name: cd

on:
    push:
        branches: [main]

jobs:
    deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Check out codeMore actions
              uses: actions/checkout@v4

            - name: Install Goose
              run: GOBIN=/usr/local/bin go install github.com/pressly/goose/v3/cmd/goose@latest

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.22.0'

            - name: Build App
              run: ./scripts/buildprod.sh

            # Make the script executable
            - name: Make build script executableAdd commentMore actions
              run: chmod +x ./scripts/buildprod.sh

            - id: auth
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_CREDENTIALS }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v1

            - name: 'Build and push to Docker'
              run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-438723/notely-r-repository/notely:latest .'

            - name: Make migration script executable
              run: chmod +x ./scripts/migrateup.sh

            - name: Run Database Migrations
              run: |
                  FIXED_URL=libsql://${DATABASE_URL#*://}
                  DATABASE_URL="$FIXED_URL" ./scripts/migrateup.sh
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Deploy to Cloud Run
              run: 'gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-438723/notely-r-repository/notely:latest --region us-central1 --allow-unauthenticated --project notely-438723 --max-instances=4'
